# ┌─────────────────────────────────────────────────────────────────────────┐
# │ flowbar · ~/.config/flowbar/config.ini                                   │
# │                                                                         │
# │ One file for everything. Save it and the bar rebuilds itself on the    │
# │ spot, even while it's open. Delete any line to get its default back.   │
# │ Deeper styling goes in style.css next to this file (see README).       │
# └─────────────────────────────────────────────────────────────────────────┘

[theme]
# azure · catppuccin · tokyo-night · gruvbox · nord · rose-pine
preset = azure

# Override any preset color. Accepts #rgb, #rrggbb, rgb() / rgba().
# accent     = #00A2E8     # icons, key badges, meters, selection
# accent-2   = #89dceb     # the active chip's key badge, today in the calendar
# background = #11111b
# foreground = #cdd6f4
# good       = #a6e3a1     # "on" states

# Background opacity of the bar and panels, 0 to 1.
opacity = 0.94
font = CommitMono Nerd Font
font-size = 15
# Corner radius in px. 0 for sharp corners.
radius = 22


[bar]
# Which modules go where, in order. Leave a section empty to drop it.
# Built in: workspaces time calendar media clipboard screenshot night updates
#           wifi bluetooth volume display system power
# Plus any [custom.NAME] module you define below.
left   = workspaces time calendar media
center = clipboard screenshot night updates
right  = wifi bluetooth volume display system power

# Gap around the bar, in px. auto = niri's layout `gaps`, so the bar sits as far from
# the screen edges and from your windows as they sit from each other.
margin = auto
# Bar height in px, border included. 24 matches a stock waybar.
height = 24
# Slide windows down to make room while the bar is up (false: float over them).
push-windows = true


[motion]
# Multiplies every animation. 1 = default, 1.5 matches niri's `slowdown 1.5`,
# 0.5 = snappy, 0 = no animation at all.
speed = 1.0


[keys]
# The key that opens each module. A letter, or a key name like F1, comma, period.
# workspaces = o
# time = t
# calendar = c
# media = m
# clipboard = y
# screenshot = g
# night = n
# updates = u
# wifi = w
# bluetooth = b
# volume = v
# display = d
# system = s
# power = p


[icons]
# Swap any chip icon, e.g. for another Nerd Font glyph or plain text.
# wifi = 󰖩
# power = ⏻


[commands]
# How to run a command in a terminal. flowbar appends the command after this.
# Examples: kitty -e · foot · alacritty -e · wezterm start --
terminal = kitty -e
# Updating: yay or paru also list AUR updates in the panel.
update = yay
lock = swaylock
suspend = systemctl suspend
logout = niri msg action quit --skip-confirmation
reboot = systemctl reboot
poweroff = systemctl poweroff


[volume]
step = 5

[display]
step = 5

[night]
# Color temperature in Kelvin while night light is on.
temperature = 4000

[clipboard]
# How many copies to remember.
keep = 30

[updates]
# Minutes between update checks (they hit the network).
interval = 30

[screenshot]
# Where niri saves screenshots (its screenshot-path). Used by `o` to open the folder.
dir = ~/Pictures/Screenshots


# ─── Your own modules ────────────────────────────────────────────────────
# Any shell command becomes a chip. Add its name to a [bar] line to show it.
# The chip shows the first line of output, the panel all of it.
#
# [custom.weather]
# key = e
# icon =
# title = Weather
# exec = curl -s 'wttr.in/?format=%c+%t'
# interval = 900              # seconds between runs while the bar is up
# on-enter = xdg-open https://wttr.in
# close-on-enter = true       # hide the bar after Enter
#
# [custom.vpn]
# key = x
# icon = 󰖂
# exec = nmcli -t -f NAME,TYPE connection show --active | grep -q vpn && echo on || echo off
# on-enter = nmcli connection up id my-vpn
# close-on-enter = false
